<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paging Page</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <Header>
    <nav class="navbar bg-body-tertiary p-0">
      <div class="w-100" style="background-color: #13152A;">
        <div class="navbar-brand d-flex justify-content-between">
            <div class="d-flex align-items-center">
                <img src="../images/logo.png" alt="Logo" width="60" height="48" class="d-inline-block rounded-4 ms-5 ">
                <div class="fs-2 ms-2 p-2 text-white">Operating Systems</div>
            </div>
            <div class="mt-2 me-4">
                    <p class="fs-4 text-white m-0">“Life is like memory frames; the choices we hold shape the next step.”</p>
                <div class="d-flex flex-row-reverse pb-1">
                    <footer class="blockquote-footer m-0">By <cite title="Source Title">Avery Lane</cite></footer>  
                </div>
            </div>
        </div>
      </div>
    </nav>
  </Header>

  <div class="mainBody" style="min-height: 610px;">
    <main class="container d-flex justify-content-center">
    <div class="card mt-5 rounded-3 text-white" style="background-color: #262A54; width: 65%;">
      <h5 class="card-header">Input For Paging</h5>
      <div class="card-body bg-white text-dark rounded-bottom">
        <form id="pagingForm" class="px-3">
          <div class="row mb-3 text-center fw-semibold" style="color: #13152A;">
            <div class="col-4">Number of Frames</div>
            <div class="col-8">Page Reference String</div>
          </div>

          <div class="row align-items-center mb-3">
            <div class="col-4 d-flex justify-content-center">
              <input
                type="number"
                class="form-control text-center border-0 border-bottom border-dark w-75"
                id="numFrames"
                value="3"
              />
            </div>
            <div class="col-8 d-flex justify-content-center">
              <input
                type="text"
                class="form-control text-center border-0 border-bottom border-dark w-75"
                id="refString"
                value="7,0,1,2,0,3,0,4,2,3,0,3,2"
              />
            </div>
          </div>

          <div class="d-flex justify-content-end align-items-center gap-3 mt-3">
            <div class="dropdown" style="min-width: 180px;">
              <button
                class="btn btn-primary dropdown-toggle w-100"
                id="algo"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                FCFS
              </button>
              <ul class="dropdown-menu w-100">
                <li><a class="dropdown-item algos" id="algos-fifo">FIFO</a></li>
                <li><a class="dropdown-item algos" id="algos-lru">LRU</a></li>
                <li><a class="dropdown-item algos" id="algos-mru">MRU</a></li>
                <li><a class="dropdown-item algos" id="algos-optimal">Optimal</a></li>
              </ul>
            </div>

            <button type="submit" class="btn btn-primary" id="runBtn">Run Simulation</button>
          </div>
        </form>
      </div>
    </div>
  </main>

    <main class="container d-flex justify-content-center mb-5">
      <div class="card mt-5 rounded-3 text-white" style="background-color: #262A54; width: 90%; display: none;" id="showOutput">
        <h5 class="card-header">Paging Simulation Output</h5>
        <div class="card-body bg-white text-dark rounded-bottom">
          <h5>Frame Visualisation (At Every Step)</h5>
          <div id="frameContainer"></div>
          <p class="fw-bold mt-3" id="totalFaults"></p>
        </div>
      </div>
    </main>
  </div>

  <Footer>
    <nav class="footer sticky-bottom p-0">
      <div class="w-100" style="background-color: #13152A;">
        <div class="navbar-brand d-flex justify-content-end">
          <div class="fs-4 me-5 p-2 text-white">A Simple Guide For Operating Systems</div>
        </div>
      </div>
    </nav>
  </Footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/PagingPage.js"></script>
</body>
</html>
